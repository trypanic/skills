# Tier 3 (OPTIONAL) agent routing for one context.
# A context without this file is fully valid — the map is an optimization,
# never a dependency of the model.
#
# Task patterns are free strings matched by the agent; there is no closed
# intent vocabulary. Each read set is an allowlist — no do-not-read lists.

apiVersion: context-map/v2
context: <context-id>

bootstrap:
  - context.md

tasks:
  - pattern: "fix a bug / regression in <area>"
    read:
      - workflows/<main-flow>.md
      - observability.md
    inspect_contracts: [published, consumed]
    code: entrypoints.source
    tests: entrypoints.tests
    adr_required_if:
      - boundary_changes
      - dependency_changes
      - ownership_changes

  - pattern: "change or version a published contract"
    read:
      - contracts/published/
    inspect_contracts: [published, consumed]
    adr_required_if:
      - breaking_semantic_change
      - dependency_topology_changes

  - pattern: "investigate an incident"
    read:
      - observability.md
    inspect_contracts: [published]
    symptoms:
      - symptom: "<observable symptom>"
        read:
          - runbooks/<matching-runbook>.md

guardrails:
  - never_redefine_a_consumed_contract
  - never_modify_a_published_contract_without_version_bump
  - never_depend_on_other_context_internals
  - never_change_context_identity_without_adr
  - never_treat_references_as_source_of_truth
  - never_hand_edit_generated_files
